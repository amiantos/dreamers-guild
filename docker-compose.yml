version: '3.8'

services:
  dreamers-guild:
    build: .
    container_name: dreamers-guild-server
    ports:
      - "8005:8005"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8005
      # HTTP Basic Auth credentials (set in .env, gitignored)
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
